name: 채용공고 매일 갱신
on:
  schedule:
    - cron: "0 21 * * *"   # 한국 시간 매일 06:00
  workflow_dispatch:         # 수동 실행 버튼
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 알리오에서 받기
        run: python3 scripts/fetch_alio.py
      - name: 바뀌었으면 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/jobs.json
          git diff --staged --quiet || git commit -m "채용공고 데이터 갱신"
          git push
